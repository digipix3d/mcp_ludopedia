apiVersion: v1
kind: Service
metadata:
  name: ludopedia-mcp-server
  namespace: mcp-servers
  labels:
    app: ludopedia-mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: ludopedia-mcp-server
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
