apiVersion: apps/v1
kind: Deployment
metadata:
  name: ludopedia-mcp-server
  namespace: mcp-servers
  labels:
    app: ludopedia-mcp-server
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ludopedia-mcp-server
  template:
    metadata:
      labels:
        app: ludopedia-mcp-server
        version: v1.0.0
    spec:
      containers:
      - name: mcp-server
        image: ludopedia-mcp-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8000"
        - name: HOST
          value: "0.0.0.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
