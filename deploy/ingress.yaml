apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ludopedia-mcp-server
  namespace: mcp-servers
  annotations:
    # Nginx Ingress Controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # Respostas em streaming do MCP (Streamable HTTP)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$http_upgrade"
    # CORS (se necessário)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
    # Cert-manager (opcional, para certificados automáticos)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ludopedia-mcp.seudominio.com
    secretName: ludopedia-mcp-tls
  rules:
  - host: ludopedia-mcp.seudominio.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ludopedia-mcp-server
            port:
              number: 8000
