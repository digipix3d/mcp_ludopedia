version: '3.8'

services:
  ludopedia-mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ludopedia-mcp-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Opcional (uso pessoal): token usado quando o cliente não manda o header Authorization
      - LUDOPEDIA_TOKEN=${LUDOPEDIA_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
